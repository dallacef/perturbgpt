name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: ruff + pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      # CPU wheel keeps CI fast and avoids pulling ~2 GB of CUDA libraries.
      - name: Install CPU PyTorch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install package (dev + retrieval + api extras)
        run: pip install -e ".[dev,retrieval,api]"

      - name: Lint
        run: ruff check .

      # No network, checkpoints, indices or cached embeddings are required:
      # every test either synthesises its inputs or skips a missing optional
      # dependency.  gseapy / sentence-transformers tests use fakes.
      - name: Test
        run: pytest -q
