# Training hyperparameters: optimizer, learning rate schedule, batch size,
# split random seed, early-stopping criteria.

splitting:
  seed: 42
  perturbation_split:
    train_frac: 0.70
    val_frac: 0.15
    test_frac: 0.15
    control_split: "train"       # which split receives control cells
  combinatorial_split:
    combo_train_frac: 0.50       # fraction of 2-gene combos kept in training
  persist_dir: "data/processed/splits"

optimizer:
  name: "adam"
  lr: 1.0e-4
  weight_decay: 1.0e-5

schedule:
  warmup_steps: 500

batch_size: 64

early_stopping:
  patience: 10
  min_delta: 1.0e-4

wandb:
  enabled: false
  project: "perturbgpt-baseline"
  entity: null              # wandb username or team; null = default
  run_name: null            # null = auto-generated by wandb
  tags: ["baseline"]
  log_interval: 1           # log train/val loss every N epochs
  full_val_interval: 5      # log full val metrics every N epochs

