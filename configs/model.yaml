# Architecture hyperparameters for the baseline and prediction-head models.

baseline:
  # Learned perturbation embedding (one row per perturbation identity) fed
  # through an MLP. No cell-state or expression features are used.
  embed_dim: 64
  hidden_dim: 256
  num_layers: 2
  dropout: 0.1
  lr: 1.0e-3
  epochs: 100
  early_stopping: true
  patience: 10
  top_k: 50

prediction_head:
  # Frozen scGPT gene embedding (summed per perturbation) fed through an MLP.
  # The embedding dim is auto-detected from the cached embeddings at runtime;
  # these defaults are used only if the config is read without the cache.
  pert_emb_dim: 512
  hidden_dim: 256
  num_layers: 2
  dropout: 0.1
  lr: 1.0e-4
  weight_decay: 1.0e-5
  epochs: 100
  early_stopping: true
  patience: 10
  top_k: 50

